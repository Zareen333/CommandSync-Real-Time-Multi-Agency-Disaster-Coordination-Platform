<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CommandSync | Citizen Distress SOS</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b1120; color: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; text-align: center; }
    .card { max-width: 420px; width: 100%; background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h2 { color: #ef4444; font-size: 22px; margin-bottom: 6px; }
    .sos-btn { width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle, #ef4444, #b91c1c); border: 4px solid #fca5a5; color: white; font-size: 24px; font-weight: 900; cursor: pointer; margin: 20px auto; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 30px rgba(239, 68, 68, 0.5); transition: 0.2s; }
    .sos-btn:active { transform: scale(0.95); }
    select, input { width: 100%; padding: 12px; background: #1e293b; border: 1px solid #334155; color: white; border-radius: 6px; margin-bottom: 12px; font-size: 14px; outline: none; }
    #status-box { font-size: 13px; color: #94a3b8; line-height: 1.4; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>EMERGENCY DISTRESS NODE</h2>
    <p style="font-size: 12px; color: #94a3b8;">Transmits precise satellite coordinates directly to the Incident Control Room</p>

    <div style="margin-top: 18px; text-align: left;">
      <label style="font-size: 12px; color: #cbd5e1;">Emergency Type:</label>
      <select id="emergencyType">
        <option value="Flood Trapped / Rising Water">🌊 Flood Trapped / Rising Water</option>
        <option value="Train / Metro Emergency">🚆 Train / Metro Emergency</option>
        <option value="Structural Collapse / Debris">🏚️ Structural Collapse / Debris</option>
        <option value="Critical Medical Trauma">🩺 Critical Medical Trauma</option>
      </select>

      <label style="font-size: 12px; color: #cbd5e1;">Contact Phone Number:</label>
      <input type="tel" id="citizenPhone" placeholder="+91 98765 43210" />
    </div>

    <button class="sos-btn" onclick="sendDistressSignal()">SOS</button>

    <div id="status-box">Tap SOS to broadcast your live satellite location.</div>
  </div>

  <script>
    const socket = typeof io !== 'undefined' ? io() : null;

    function sendDistressSignal() {
      const statusBox = document.getElementById('status-box');
      const emergencyType = document.getElementById('emergencyType').value;
      const citizenPhone = document.getElementById('citizenPhone').value || "Unknown Contact";

      statusBox.innerHTML = "<span style='color:#38bdf8;'>Acquiring satellite lock...</span>";

      if (!("geolocation" in navigator)) {
        statusBox.innerHTML = "<span style='color:#ef4444;'>Geolocation unavailable. Dial 112 immediately.</span>";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const payload = {
            id: 'SOS-' + Math.floor(1000 + Math.random() * 9000),
            lat: pos.coords.latitude,
            lng: pos.coords.longitude,
            type: emergencyType,
            phone: citizenPhone,
            timestamp: new Date().toLocaleTimeString()
          };

          if (socket) socket.emit('citizen-sos-alert', payload);

          statusBox.innerHTML = `
            <div style="background: rgba(34, 197, 94, 0.15); border: 1px solid #22c55e; padding: 10px; border-radius: 6px; color: #4ade80;">
              <strong>✓ DISTRESS ALERT BROADCASTED</strong><br>
              Incident Ticket: <b>${payload.id}</b><br>
              Control Room has received your coordinates and is coordinating dispatch.
            </div>
          `;
        },
        (err) => {
          // Fallback simulation coordinates in case browser blocks GPS
          const fallbackLat = 19.0782 + (Math.random() - 0.5) * 0.01;
          const fallbackLng = 73.0915 + (Math.random() - 0.5) * 0.01;
          const payload = {
            id: 'SOS-' + Math.floor(1000 + Math.random() * 9000),
            lat: fallbackLat,
            lng: fallbackLng,
            type: emergencyType,
            phone: citizenPhone,
            timestamp: new Date().toLocaleTimeString()
          };

          if (socket) socket.emit('citizen-sos-alert', payload);

          statusBox.innerHTML = `
            <div style="background: rgba(34, 197, 94, 0.15); border: 1px solid #22c55e; padding: 10px; border-radius: 6px; color: #4ade80;">
              <strong>✓ SOS BROADCASTED (Fallback Location)</strong><br>
              Incident Ticket: <b>${payload.id}</b>
            </div>
          `;
        },
        { enableHighAccuracy: true, timeout: 5000 }
      );
    }
  </script>
</body>
</html>
