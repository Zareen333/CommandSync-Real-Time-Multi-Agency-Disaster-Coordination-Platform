<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CommandSync | Tactical Incident Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b1120; color: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .portal-container { max-width: 480px; width: 100%; background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 28px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); text-align: center; }
    h1 { font-size: 24px; color: #38bdf8; margin-bottom: 4px; }
    p.sub { font-size: 13px; color: #94a3b8; margin-bottom: 24px; }
    .role-grid { display: flex; flex-direction: column; gap: 12px; }
    .role-btn { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-radius: 8px; border: 1px solid #334155; text-decoration: none; color: white; font-weight: 600; font-size: 14px; transition: 0.2s; background: #1e293b; }
    .role-btn:hover { border-color: #38bdf8; transform: translateY(-2px); }
    .role-control { border-left: 4px solid #38bdf8; }
    .role-citizen { border-left: 4px solid #ef4444; background: rgba(239, 68, 68, 0.1); }
    .role-ndrf { border-left: 4px solid #f97316; }
    .role-police { border-left: 4px solid #3b82f6; }
    .role-med { border-left: 4px solid #22c55e; }
    .badge { font-size: 11px; padding: 2px 8px; border-radius: 4px; background: #334155; }
  </style>
</head>
<body>
  <div class="portal-container">
    <h1>CommandSync</h1>
    <p class="sub">Select your operational role to enter the dashboard</p>
    
    <div class="role-grid">
      <a href="/citizen.html" class="role-btn role-citizen">
        <span>🚨 Citizen Distress Portal (SOS)</span>
        <span class="badge" style="background:#ef4444; color:white;">Emergency</span>
      </a>

      <a href="/control-room.html" class="role-btn role-control">
        <span>🖥️ Master Control Room (EOC)</span>
        <span class="badge" style="color:#38bdf8;">Command Center</span>
      </a>

      <a href="/responder.html?role=ndrf" class="role-btn role-ndrf">
        <span>🚤 NDRF Rescue Boat Fleet</span>
        <span class="badge" style="color:#fb923c;">Field Unit</span>
      </a>

      <a href="/responder.html?role=police" class="role-btn role-police">
        <span>🚓 Police Rapid Patrol</span>
        <span class="badge" style="color:#60a5fa;">Field Unit</span>
      </a>

      <a href="/responder.html?role=med" class="role-btn role-med">
        <span>🚑 Trauma Ambulance Fleet</span>
        <span class="badge" style="color:#4ade80;">Field Unit</span>
      </a>
    </div>
  </div>
</body>
</html>
