<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CommandSync | Live Tactical EOC</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/socket.io/socket.io.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; height: 100vh; background-color: #0b1120; color: #f8fafc; overflow: hidden; }
    
    #sidebar {
      width: 360px;
      background-color: #0f172a;
      border-right: 1px solid #1e293b;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      z-index: 1000;
      overflow-y: auto;
    }
    
    .badge {
      display: inline-block;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: bold;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .badge-live { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; }
    
    h1 { font-size: 19px; font-weight: 700; color: #38bdf8; display: flex; align-items: center; justify-content: space-between; }
    p.subtitle { font-size: 12px; color: #94a3b8; margin-top: -6px; }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
    }
    .card-title { font-weight: bold; margin-bottom: 6px; color: #e2e8f0; }

    .custom-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 11px;
      font-weight: 700;
      border-radius: 50%;
      border: 2px solid white;
      box-shadow: 0 0 12px rgba(0,0,0,0.6);
    }
    
    #map { flex: 1; height: 100%; cursor: crosshair; }
  </style>
</head>
<body>

  <div id="sidebar">
    <div>
      <h1>CommandSync <span class="badge badge-live">● LIVE EOC</span></h1>
      <p class="subtitle">Disaster Multi-Agency Coordination</p>
    </div>

    <div class="card">
      <div class="card-title">📡 Live Responder Telemetry</div>
      <div id="unit-status" style="color: #94a3b8;">Waiting for field unit...</div>
      <div id="unit-coords" style="font-family: monospace; color: #38bdf8; margin-top: 4px; font-size: 12px;"></div>
    </div>

    <div class="card">
      <div class="card-title">🚨 Active Distress Incident</div>
      <div id="active-sos-title" style="color: #94a3b8; font-weight: bold;">No Active SOS Signal</div>
      <div id="active-sos-sub" style="font-size: 12px; color: #64748b; margin-top: 4px;">Click anywhere on the map to trigger a distress alert.</div>
    </div>

    <div class="card">
      <div class="card-title">⚡ Dynamic Routing Status</div>
      <div id="routing-status" style="color: #4ade80; font-size: 12px;">
        ✔ Dynamic Hazard Engine: Active (Avoiding Flood Polygon)
      </div>
    </div>
  </div>

  <div id="map"></div>

  <script>
    const socket = io();

    // 1. Initialize Map
    const map = L.map('map').setView([19.0782, 73.0915], 15);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);

    function createPin(color, label) {
      return L.divIcon({
        className: 'custom-icon',
        html: `<div style="background-color:${color}; width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:2px solid white;">${label}</div>`,
        iconSize: [32, 32],
        iconAnchor: [16, 16]
      });
    }

    // 2. Define Hazard Polygon (Flood Zone)
    const floodZone = L.polygon([
      [19.0790, 73.0940],
      [19.0840, 73.0980],
      [19.0800, 73.1010],
      [19.0750, 73.0960]
    ], {
      color: '#ef4444',
      fillColor: '#ef4444',
      fillOpacity: 0.45
    }).addTo(map).bindPopup('<b>HAZARD ZONE:</b> Flooded Highway (Depth 4.2ft)');

    map.fitBounds(floodZone.getBounds().pad(0.4));

    let responderMarker = null;
    let sosMarker = null;
    let currentSosCoords = null;
    let pathLine = null;
    let initialZoomSet = false;

    // Helper to send SOS on click
    function triggerSos(lat, lng) {
      const newSosData = {
        lat: lat,
        lng: lng,
        id: 'SOS #' + Math.floor(100 + Math.random() * 900)
      };
      console.log("Sending SOS click event:", newSosData);
      socket.emit('send-sos', newSosData);
    }

    // 3. Click Map or Polygon to Trigger Live Citizen SOS
    map.on('click', (e) => { triggerSos(e.latlng.lat, e.latlng.lng); });
    floodZone.on('click', (e) => { triggerSos(e.latlng.lat, e.latlng.lng); });

    // 4. Listen for SOS Broadcasts
    socket.on('sos-broadcast', (data) => {
      console.log("SOS Broadcast received on dashboard:", data);
      currentSosCoords = [data.lat, data.lng];

      // Remove previous SOS pin if one already exists
      if (sosMarker) { map.removeLayer(sosMarker); }

      // Drop new single SOS Pin on Map
      sosMarker = L.marker(currentSosCoords, { icon: createPin('#ef4444', 'SOS') })
        .addTo(map)
        .bindPopup(`<b>CRITICAL ${data.id}</b><br>Live Citizen Distress Signal!`)
        .openPopup();

      // Update Sidebar Card
      document.getElementById('active-sos-title').style.color = '#ef4444';
      document.getElementById('active-sos-title').innerText = `${data.id}: Live Distress Alert`;
      document.getElementById('active-sos-sub').style.color = '#94a3b8';
      document.getElementById('active-sos-sub').innerText = `Lat: ${data.lat.toFixed(4)}, Lng: ${data.lng.toFixed(4)} (Dispatch Assigned)`;

      // Recalculate Detour Path directly to NEW SOS
      if (responderMarker) {
        const currentPos = responderMarker.getLatLng();
        if (pathLine) { map.removeLayer(pathLine); }
        pathLine = L.polyline([
          [currentPos.lat, currentPos.lng],
          [19.0740, 73.0990], // Detour waypoint avoiding flood polygon
          currentSosCoords
        ], { color: '#38bdf8', weight: 4, dashArray: '5, 8' }).addTo(map);
      }
    });

    // 5. Handle Live Telemetry Stream
    socket.on('telemetry-broadcast', (data) => {
      const { id, lat, lng } = data;

      document.getElementById('unit-status').innerHTML = `<span style="color:#4ade80;">● ${id} Broadcasting</span>`;
      document.getElementById('unit-coords').innerText = `Lat: ${lat.toFixed(5)}, Lng: ${lng.toFixed(5)}`;

      const currentPos = [lat, lng];

      if (!responderMarker) {
        responderMarker = L.marker(currentPos, { icon: createPin('#f97316', 'NDRF') })
          .addTo(map)
          .bindPopup(`<b>${id}</b><br>Live Telemetry Stream`)
          .openPopup();
      } else {
        responderMarker.setLatLng(currentPos);
      }

      // Auto-fit camera view on first signal
      if (!initialZoomSet) {
        const groupArray = [responderMarker, floodZone];
        if (sosMarker) groupArray.push(sosMarker);
        const tacticalGroup = new L.featureGroup(groupArray);
        map.fitBounds(tacticalGroup.getBounds().pad(0.2));
        initialZoomSet = true;
      }

      // Dynamic path recalculation avoiding flood zone (if SOS exists)
      if (currentSosCoords) {
        if (pathLine) { map.removeLayer(pathLine); }
        pathLine = L.polyline([
          currentPos,
          [19.0740, 73.0990], // Detour waypoint around flood zone
          currentSosCoords
        ], { color: '#38bdf8', weight: 4, dashArray: '5, 8' }).addTo(map);
      }
    });
  </script>
</body>
</html>
