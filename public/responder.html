<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CommandSync | Field Unit Telemetry</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body {
      background: radial-gradient(circle at 50% 10%, #1e293b 0%, #090d16 100%);
      color: white;
      text-align: center;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .card {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.6);
    }

    h2 { font-size: 19px; font-weight: 800; color: #38bdf8; margin-bottom: 2px; }
    p.subtitle { color: #94a3b8; font-size: 11.5px; margin-bottom: 18px; }

    select {
      width: 100%;
      padding: 12px;
      background: #131b2e;
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      font-size: 13.5px;
      margin-bottom: 16px;
      outline: none;
    }

    .btn {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: white;
      border: none;
      padding: 14px;
      width: 100%;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.3);
      transition: 0.2s;
    }

    .btn:active { transform: scale(0.98); }
    #status { margin-top: 14px; font-size: 12px; color: #94a3b8; font-weight: 600; }
    #data { font-family: 'JetBrains Mono', monospace; margin-top: 10px; color: #4ade80; font-size: 11.5px; line-height: 1.5; }
    
    #mission-card {
      display: none;
      background: #090d16;
      border: 1px solid #f97316;
      border-left: 4px solid #f97316;
      border-radius: 8px;
      padding: 12px;
      margin-top: 16px;
      text-align: left;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>📡 TELEMETRY UPLINK</h2>
    <p class="subtitle">CommandSync Zero-Install Field Node</p>

    <label style="font-size: 11px; font-weight: 700; color: #cbd5e1; display: block; text-align: left; margin-bottom: 6px;">ASSIGNED AGENCY UNIT</label>
    <select id="unitSelect">
      <option value="NDRF-Unit-12">NDRF Rescue Boat #12</option>
      <option value="POLICE-Unit-04">Police Patrol Unit 04</option>
      <option value="AMB-Med-01">ICU Ambulance Med-01</option>
    </select>

    <button class="btn" id="streamBtn" onclick="toggleBroadcasting()">Start Live GPS Stream</button>

    <div id="status">Status: Standby</div>
    <div id="data"></div>

    <div id="mission-card">
      <strong style="color: #fb923c; font-size: 11.5px;">🚨 ACTIVE DISPATCH ORDER:</strong>
      <div id="mission-info" style="font-size: 11px; color: #cbd5e1; margin-top: 4px;"></div>
    </div>
  </div>

  <script>
    const socket = typeof io !== 'undefined' ? io() : null;
    let watchId = null;

    const urlParams = new URLSearchParams(window.location.search);
    const roleParam = urlParams.get('role');
    if (roleParam === 'police') document.getElementById('unitSelect').value = "POLICE-Unit-04";
    if (roleParam === 'med') document.getElementById('unitSelect').value = "AMB-Med-01";

    function toggleBroadcasting() {
      const btn = document.getElementById('streamBtn');
      const status = document.getElementById('status');
      const dataBox = document.getElementById('data');
      const unitId = document.getElementById('unitSelect').value;

      if (watchId) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        btn.innerText = "Start Live GPS Stream";
        btn.style.background = "linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%)";
        status.innerText = "Status: Paused";
        status.style.color = "#94a3b8";
        return;
      }

      if (!("geolocation" in navigator)) {
        alert("Geolocation not supported on this browser.");
        return;
      }

      status.innerText = "Connecting to satellite grid...";
      status.style.color = "#38bdf8";

      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          const payload = {
            id: unitId,
            lat: pos.coords.latitude,
            lng: pos.coords.longitude
          };

          if (socket) socket.emit('gps-update', payload);

          btn.innerText = "Stop Telemetry Stream";
          btn.style.background = "linear-gradient(135deg, #ef4444 0%, #b91c1c 100%)";
          status.innerHTML = `<span style="color:#4ade80;">● Broadcasting telemetry</span>`;
          dataBox.innerText = `Unit: ${payload.id}\nLat: ${payload.lat.toFixed(5)}\nLng: ${payload.lng.toFixed(5)}`;
        },
        (err) => {
          status.innerText = "GPS Error: " + err.message;
          status.style.color = "#ef4444";
        },
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
      );
    }

    if (socket) {
      socket.on('agency-mission-assigned', (data) => {
        const missionCard = document.getElementById('mission-card');
        const missionInfo = document.getElementById('mission-info');
        missionCard.style.display = 'block';
        missionInfo.innerHTML = `
          Incident: <b>${data.sosId}</b><br>
          Assigned to: <b>${data.agency}</b><br>
          Target: Lat ${data.lat.toFixed(4)}, Lng ${data.lng.toFixed(4)}<br>
          Time: ${data.timestamp}
        `;
      });
    }
  </script>
</body>
</html>
